name: ofbiz-modern-local
services:
  catalog-postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to an approved internal, digest-pinned PostgreSQL image}
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - catalog-data:/var/lib/postgresql/data

  product-catalog-service:
    build:
      context: ..
      dockerfile: services/product-catalog-service/Dockerfile
      args:
        BUILD_IMAGE: ${GRADLE_IMAGE:?Set GRADLE_IMAGE to an approved internal, digest-pinned Java 21 Gradle image}
        RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?Set JAVA_RUNTIME_IMAGE to an approved internal, digest-pinned Java 21 runtime image}
        ARTIFACTORY_GRADLE_PLUGIN_URL: ${ARTIFACTORY_GRADLE_PLUGIN_URL:?Set the approved Gradle plugin repository URL}
        ARTIFACTORY_MAVEN_URL: ${ARTIFACTORY_MAVEN_URL:?Set the approved Maven repository URL}
      secrets:
        - gradle_init
        - artifactory_user
        - artifactory_token
        - corporate_ca
    environment:
      CATALOG_DATABASE_URL: jdbc:postgresql://catalog-postgres:5432/catalog
      CATALOG_DATABASE_USER: catalog
      CATALOG_DATABASE_PASSWORD: ${CATALOG_DATABASE_PASSWORD:?Set a development-only catalog database password}
      CATALOG_SECURITY_MODE: local
    depends_on:
      catalog-postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 24

  modern-shell:
    build:
      context: ..
      dockerfile: web/shell/Dockerfile
      args:
        RUNTIME_IMAGE: ${NGINX_IMAGE:?Set NGINX_IMAGE to an approved internal, digest-pinned nginx image}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  gateway:
    build:
      context: ..
      dockerfile: local-dev/gateway/Dockerfile
      args:
        RUNTIME_IMAGE: ${NGINX_IMAGE:?Set NGINX_IMAGE to an approved internal, digest-pinned nginx image}
    ports:
      - "${MODERN_GATEWAY_PORT:-8081}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      product-catalog-service: { condition: service_healthy }
      modern-shell: { condition: service_healthy }

volumes:
  catalog-data:

secrets:
  gradle_init:
    file: ../gradle/modern-artifactory.init.gradle
  artifactory_user:
    file: ${ARTIFACTORY_USER_FILE:?Set ARTIFACTORY_USER_FILE to a local secret file}
  artifactory_token:
    file: ${ARTIFACTORY_TOKEN_FILE:?Set ARTIFACTORY_TOKEN_FILE to a local secret file}
  corporate_ca:
    file: ${CORPORATE_CA_FILE:?Set CORPORATE_CA_FILE to the corporate CA PEM file}
