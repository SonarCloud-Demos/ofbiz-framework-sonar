upstream modern_shell { server modern-shell:8080; }
upstream catalog_service { server product-catalog-service:8080; }

server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    location /modern/ {
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://modern_shell;
    }

    location /api/catalog/v1/products {
        limit_except GET { deny all; }
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://catalog_service;
    }

    location = /healthz { access_log off; return 204; }
    location / { return 404; }
}
