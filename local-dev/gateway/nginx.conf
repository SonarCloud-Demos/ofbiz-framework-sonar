events {
    worker_connections 1024;
}

http {
    upstream legacy_ofbiz {
        server legacy-ofbiz-app:8443;
    }

    upstream accounting_invoices {
        server modern-accounting-invoice-service:8080;
    }

    upstream notifications {
        server modern-notification-service:8080;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /run/secrets/gateway_tls_cert;
        ssl_certificate_key /run/secrets/gateway_tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /accounting/control/findInvoices {
            proxy_pass http://accounting_invoices/modern/accounting/invoices;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /modern/accounting/invoices {
            proxy_pass http://accounting_invoices;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/accounting/invoices {
            proxy_pass http://accounting_invoices;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/notifications/health {
            proxy_pass http://notifications/api/notifications/health;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass https://legacy_ofbiz;
            proxy_ssl_verify off;
            proxy_set_header Host localhost:18443;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "";
            proxy_redirect https://localhost:18443/ https://localhost:18080/;
            sub_filter_once off;
            sub_filter 'https://localhost:18443' 'https://localhost:18080';
        }
    }
}
