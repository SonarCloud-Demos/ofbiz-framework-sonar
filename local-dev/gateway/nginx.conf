upstream modern_shell { server modern-shell:8080; }
upstream catalog_service { server product-catalog-service:8080; }
upstream legacy_ofbiz { server host.docker.internal:8443; }

map $cookie_ofbiz_local_session $local_authenticated {
    default 0;
    developer 1;
}

map "$arg_forceLegacy:$cookie_catalog_pilot_cohort" $catalog_find_upstream {
    default legacy_ofbiz;
    ":staff" modern_shell;
}

map "$arg_forceLegacy:$cookie_catalog_pilot_cohort" $catalog_find_uri {
    default /catalog/control/FindProduct;
    ":staff" /modern/catalog/products;
}

map "$arg_forceLegacy:$cookie_catalog_pilot_cohort" $catalog_find_scheme {
    default https;
    ":staff" http;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    location = /auth/session {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"authenticated":$local_authenticated,"mode":"local","displayName":"Local developer"}';
    }

    location = /auth/local/login {
        limit_except POST { deny all; }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Set-Cookie "ofbiz_local_session=developer; Path=/; HttpOnly; SameSite=Strict" always;
        return 200 '{"authenticated":true,"mode":"local","displayName":"Local developer"}';
    }

    location = /auth/logout {
        limit_except POST { deny all; }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Set-Cookie "ofbiz_local_session=; Path=/; HttpOnly; SameSite=Strict; Max-Age=0" always;
        add_header Set-Cookie "catalog_pilot_cohort=; Path=/; HttpOnly; SameSite=Strict; Max-Age=0" always;
        return 200 '{"authenticated":false,"mode":"local"}';
    }

    location = /auth/local/pilot/modern {
        limit_except POST { deny all; }
        if ($local_authenticated = 0) { return 401; }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Set-Cookie "catalog_pilot_cohort=staff; Path=/; HttpOnly; SameSite=Strict" always;
        return 200 '{"catalogPilot":"modern"}';
    }

    location = /auth/local/pilot/legacy {
        limit_except POST { deny all; }
        if ($local_authenticated = 0) { return 401; }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Set-Cookie "catalog_pilot_cohort=; Path=/; HttpOnly; SameSite=Strict; Max-Age=0" always;
        return 200 '{"catalogPilot":"legacy"}';
    }

    location = /_local_auth {
        internal;
        if ($local_authenticated = 0) { return 401; }
        return 204;
    }

    location /modern/ {
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://modern_shell;
    }

    location /api/catalog/v1/products {
        limit_except GET { deny all; }
        auth_request /_local_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://catalog_service;
    }

    location = /catalog/control/FindProduct {
        auth_request /_local_auth;
        add_header X-Catalog-Pilot-Route $catalog_find_upstream always;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off; # Local OFBiz uses its repository self-signed certificate; never use this in deployed gateways.
        proxy_pass $catalog_find_scheme://$catalog_find_upstream$catalog_find_uri$is_args$args;
    }

    location /catalog/ {
        auth_request /_local_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off; # Local-only trust exception; production APIM requires a valid private-origin certificate.
        proxy_pass https://legacy_ofbiz;
    }

    location = /healthz { access_log off; return 204; }
    location / { return 404; }
}
