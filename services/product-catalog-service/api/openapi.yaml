openapi: 3.0.3
info:
  title: Product Catalog Read API
  version: "1.0.0"
  description: Canonical Phase 5 contract for the read-only product search pilot.
paths:
  /api/catalog/v1/products:
    get:
      operationId: searchProducts
      security:
        - entra: [catalog.read]
      parameters:
        - { in: query, name: productId, schema: { type: string, maxLength: 20 } }
        - { in: query, name: internalName, schema: { type: string, maxLength: 255 } }
        - in: query
          name: sort
          schema: { type: string, enum: [productId, productTypeId, internalName, brandName, productName, description], default: productId }
        - in: query
          name: direction
          schema: { type: string, enum: [asc, desc], default: asc }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: A bounded page from the product projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400': { description: Invalid filter, sort, or page input }
        '401': { description: Authentication required }
        '403': { description: catalog.read scope required }
components:
  securitySchemes:
    entra:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
          scopes:
            catalog.read: Read the product catalog
  schemas:
    ProductSummary:
      type: object
      additionalProperties: false
      required: [productId, productTypeId]
      properties:
        productId: { type: string }
        productTypeId: { type: string }
        internalName: { type: string, nullable: true }
        brandName: { type: string, nullable: true }
        productName: { type: string, nullable: true }
        description: { type: string, nullable: true }
    ProductPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total, projectionTimestamp]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        total: { type: integer, format: int64, minimum: 0 }
        projectionTimestamp: { type: string, format: date-time }
