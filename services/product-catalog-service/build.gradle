plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'org.apache.ofbiz.modern'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux:4.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator:4.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-security:4.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server:4.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc:4.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-validation:4.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-flyway:4.1.1'
    implementation 'org.flywaydb:flyway-database-postgresql:11.7.2'
    implementation 'io.micrometer:micrometer-registry-otlp:1.15.5'
    runtimeOnly 'org.postgresql:postgresql:42.7.13'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:4.1.1'
    testImplementation 'org.springframework.boot:spring-boot-webflux-test:4.1.1'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}
