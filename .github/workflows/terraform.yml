name: Terraform validation

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [trunk]
    paths:
      - 'infra/**'
  schedule:
    - cron: '23 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.3
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Validate state bootstrap
        run: terraform -chdir=infra/bootstrap/state init -backend=false && terraform -chdir=infra/bootstrap/state validate
      - name: Validate development environment
        run: terraform -chdir=infra/environments/dev init -backend=false && terraform -chdir=infra/environments/dev validate
      - name: Validate ephemeral environment
        run: terraform -chdir=infra/environments/ephemeral init -backend=false && terraform -chdir=infra/environments/ephemeral validate
      - name: Validate staging environment
        run: terraform -chdir=infra/environments/staging init -backend=false && terraform -chdir=infra/environments/staging validate
      - name: Validate production environment
        run: terraform -chdir=infra/environments/prod init -backend=false && terraform -chdir=infra/environments/prod validate
      - name: Run native infrastructure policy tests
        run: terraform -chdir=infra/modules/platform init -backend=false && terraform -chdir=infra/modules/platform test

  plan:
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.AZURE_CLIENT_ID != ''
    needs: validate
    runs-on: ubuntu-latest
    environment: dev-plan
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_AZUREAD: true
      ARM_USE_OIDC: true
      TF_IN_AUTOMATION: true
      TF_VAR_apim_publisher_email: ${{ vars.APIM_PUBLISHER_EMAIL }}
      TF_VAR_apim_publisher_name: ${{ vars.APIM_PUBLISHER_NAME }}
      TF_VAR_budget_amount: ${{ vars.AZURE_MONTHLY_BUDGET }}
      TF_VAR_budget_contact_emails: ${{ vars.AZURE_BUDGET_CONTACT_EMAILS_JSON }}
      TF_VAR_cost_center: ${{ vars.AZURE_COST_CENTER }}
      TF_VAR_catalog_api_origin_url: ${{ vars.CATALOG_API_ORIGIN_URL }}
      TF_VAR_edge_enabled: ${{ vars.PHASE4_EDGE_ENABLED || 'false' }}
      TF_VAR_entra_api_audience: ${{ vars.ENTRA_API_AUDIENCE }}
      TF_VAR_entra_client_id: ${{ vars.ENTRA_CLIENT_ID }}
      TF_VAR_entra_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_identity_origin_url: ${{ vars.IDENTITY_ORIGIN_URL }}
      TF_VAR_legacy_ofbiz_origin_url: ${{ vars.LEGACY_OFBIZ_ORIGIN_URL }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_modern_shell_origin_url: ${{ vars.MODERN_SHELL_ORIGIN_URL }}
      TF_VAR_owner: ${{ vars.AZURE_PLATFORM_OWNER }}
      TF_VAR_postgres_administrator_login: ${{ vars.POSTGRES_ADMIN_GROUP_NAME }}
      TF_VAR_postgres_administrator_object_id: ${{ vars.POSTGRES_ADMIN_GROUP_OBJECT_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      TF_STATE_KEY: dev/platform.tfstate
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.3
      - name: Initialize remote state
        working-directory: infra/environments/dev
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}"
          -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}"
          -backend-config="container_name=${TF_STATE_CONTAINER}"
          -backend-config="key=${TF_STATE_KEY}"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"
      - name: Create speculative plan
        if: github.event_name != 'schedule'
        working-directory: infra/environments/dev
        run: terraform plan -input=false -lock=false -out=/dev/null
      - name: Detect drift
        if: github.event_name == 'schedule'
        working-directory: infra/environments/dev
        run: terraform plan -input=false -lock=false -refresh-only -detailed-exitcode
