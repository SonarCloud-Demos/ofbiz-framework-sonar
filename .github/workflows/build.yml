name: SonarQube PR

on:
  pull_request:
    branches:
      - trunk
      - 'feat-*'
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu'
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Grant execute permission for Gradle wrapper scripts
        run: chmod +x gradlew gradle/init-gradle-wrapper.sh
      - name: Initialize Gradle wrapper
        run: ./gradle/init-gradle-wrapper.sh
      - name: Create runtime directories
        run: mkdir -p runtime/tmp runtime/tempfiles
      - name: Prepare ephemeral Artifactory credentials
        env:
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
        run: |
          test -n "${ARTIFACTORY_USER}${ARTIFACTORY_TOKEN}"
          install -m 700 -d "${RUNNER_TEMP}/modern-secrets"
          umask 077
          printf '%s' "${ARTIFACTORY_USER}" > "${RUNNER_TEMP}/modern-secrets/artifactory-user"
          printf '%s' "${ARTIFACTORY_TOKEN}" > "${RUNNER_TEMP}/modern-secrets/artifactory-token"
      - name: Build and analyze pull request
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_JAVA_OPTS: -Xmx5g
          ARTIFACTORY_GRADLE_PLUGIN_URL: ${{ vars.ARTIFACTORY_GRADLE_PLUGIN_URL }}
          ARTIFACTORY_MAVEN_URL: ${{ vars.ARTIFACTORY_MAVEN_URL }}
          ARTIFACTORY_USER_FILE: ${{ runner.temp }}/modern-secrets/artifactory-user
          ARTIFACTORY_TOKEN_FILE: ${{ runner.temp }}/modern-secrets/artifactory-token
          SONAR_PR_KEY: ${{ github.event.pull_request.number }}
          SONAR_PR_BRANCH: ${{ github.head_ref }}
          SONAR_PR_BASE: ${{ github.base_ref }}
        run: >
          ./gradlew build jacocoTestReport sonar --info
          -Dsonar.pullrequest.key="${SONAR_PR_KEY}"
          -Dsonar.pullrequest.branch="${SONAR_PR_BRANCH}"
          -Dsonar.pullrequest.base="${SONAR_PR_BASE}"
      - name: Remove ephemeral Artifactory credentials
        if: always()
        run: rm -rf "${RUNNER_TEMP}/modern-secrets"
