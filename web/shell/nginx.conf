server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location /modern/assets/ { try_files $uri =404; }
    location = /modern/route-manifest.json { try_files /route-manifest.json =404; }
    location /modern/ { try_files /index.html =404; }
    location = /healthz { access_log off; return 204; }
}
