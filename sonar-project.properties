# SonarQube Cloud project configuration for local scanner and Sonar Vortex usage.
sonar.projectKey=SonarCloud-Demos_ofbiz-framework-sonar
sonar.projectName=ofbiz-sonar
sonar.organization=sonarcloud-demos
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.java.source=17
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml,services/reference-service/build/reports/jacoco/test/jacocoTestReport.xml,services/experience-bff/build/reports/jacoco/test/jacocoTestReport.xml

# Keep this aligned with the Gradle sonar configuration in build.gradle.
sonar.sources=applications,framework,themes,services,web,contracts,platform,infra,local-dev,migration,.github,build.gradle,README.md,.asf.yaml

sonar.exclusions=**/build/**,**/.gradle/**,**/node_modules/**,**/runtime/**,**/plugins/**,**/src/test/**,**/testdef/**,**/__pycache__/**,**/*.pyc,**/*.jks,**/*.p12,**/*.png,**/*.gif,**/*.jpg,**/*.jpeg,**/*.ico,**/*.ttf,**/*.woff,**/*.woff2
